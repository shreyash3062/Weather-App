<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wether App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name"
            spellcheck="false">
            <button><img src="images/search.png" class="searchimg"> </button>
        </div>
        <div class="weather">
            <img src="images/rain.png" class="wether-icon">
            <h1 class="temp">22°c</h1>
            <h2 class="city">Pune</h2>
        </div>
        <div class="details">
            <div class="col">
                    <img src="images/humidity.png" class="humiditu-icon">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
            </div>
            <div class="col">
                    <img src="images/wind.png" class="wind-icon">
                    <div>
                        <p class="wind">15 km/hr</p>
                        <p>Wind</p>
                    </div>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
