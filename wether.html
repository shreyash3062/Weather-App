<!DOCTYPE html>
<head>
    <meta name="viewport" content="width=device-width, initial scale=1.0">
    <title>Wether App</title>
    <link rel="stylesheet" href="wether.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name"
            spellcheck="false">
            <button><img src="images/search.png" class="searchimg"> </button>
        </div>
        <div class="weather">
            <img src="images/rain.png" class="wether-icon">
            <h1 class="temp">22°c</h1>
            <h2 class="city">Pune</h2>
        </div>
        <div class="details">
            <div class="col">
                    <img src="images/humidity.png" class="humiditu-icon">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
            </div>
            <div class="col">
                    <img src="images/wind.png" class="wind-icon">
                    <div>
                        <p class="wind">15 km/hr</p>
                        <p>Wind</p>
                    </div>
            </div>
        </div>
    </div>

<script>
const apikey = "0674d01f0a647769391a915eccb1a0f3";
const apiurl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

const searchBox =  document.querySelector(".search input");
const searchBtn =  document.querySelector(".search button");
const wetherIcon = document.querySelector(".weather.icon");

async function checkWeather(city) {
    const response = await fetch(apiurl + city + `&appid=${apikey}`);
    const data = await response.json();

    console.log(data);

    document.querySelector(".city").innerHTML = data.name;
    document.querySelector(".temp").innerHTML = Math.round(data.main.temp)  + "°C";
    document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
    document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";

    if(data.wether[0].main == "Clouds"){
        wetherIcon.src = "images/clouds.png";
    }
    else if(data.wether[0].main == "Clear"){
        wetherIcon.src = "images/clear.png";
    }
    else if(data.wether[0].main == "Rain"){
        wetherIcon.src = "images/rain.png";
    }
    else if(data.wether[0].main == "Drizzle"){
        wetherIcon.src = "images/drizzle.png";
    }
    else if(data.wether[0].main == "Mist"){
        wetherIcon.src = "images/mist.png";
    }
}       

searchBtn.addEventListener("click", ()=>{

checkWeather(searchBox.value);
})

</script>

</body>
</html>
